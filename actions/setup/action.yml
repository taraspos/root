name: 'Teleport Setup'
description: 'Installs `teleport`, `tsh`, `tbot` and `tctl`.'
inputs:
  version:
    required: true
    description: 'Specify the Teleport version without the preceding "v" or specify "auto" to use the version indicated by your Teleport cluster.'
  proxy:
    description: 'Specify the address of your Teleport Proxy, required if version is set to "auto".'
    required: false
  enterprise:
    required: false
    default: 'false'
    description: 'Specify whether to use the enterprise binaries.'
  cache:
    required: false
    default: 'true'
    description: 'Specify whether to leverage GitHub Actions cache for Teleport binaries. This cache is shared between workflow runs and can speed up setup time.'
outputs:
  cache-hit:
    description: 'A boolean value indicating whether the Teleport binaries were restored from the GitHub Actions cache.'
runs:
  using: 'node24'
  main: 'dist/main/index.js'
  post: 'dist/post/index.js'
  post-if: success()
extend:
  - from: '@/common/action.yml'
    include:
      - field: author
      - field: branding
